<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ALJAMAL BEAUTY | تواصل معنا</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Tahoma, sans-serif;
      min-height: 100vh;
      color: #111;
      overflow: hidden;
      position: relative;
      background:
        linear-gradient(135deg, #fff8fb 0%, #fbeff4 35%, #f5e6ee 70%, #fffafc 100%);
    }

    /* دوائر ناعمة بالخلفية */
    body::before,
    body::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      filter: blur(70px);
      z-index: 0;
      opacity: 0.55;
    }

    body::before {
      width: 280px;
      height: 280px;
      background: #f8c8dc;
      top: -60px;
      right: -60px;
    }

    body::after {
      width: 320px;
      height: 320px;
      background: #f3d8c7;
      bottom: -90px;
      left: -90px;
    }

    .header {
      width: 100%;
      padding: 26px 20px;
      text-align: center;
      border-bottom: 1px solid rgba(255,255,255,0.4);
      position: relative;
      z-index: 2;
      backdrop-filter: blur(6px);
    }

    .logo {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 3px;
      color: #222;
    }

    .hero {
      min-height: calc(100vh - 90px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      position: relative;
      z-index: 2;
    }

    .content {
      width: 100%;
      max-width: 520px;
      text-align: center;
      background: rgba(255,255,255,0.55);
      border: 1px solid rgba(255,255,255,0.6);
      backdrop-filter: blur(12px);
      border-radius: 22px;
      padding: 40px 28px;
      box-shadow: 0 12px 35px rgba(0,0,0,0.08);
    }

    .small-text {
      font-size: 16px;
      color: #6b5b63;
      line-height: 1.8;
      margin-bottom: 25px;
    }

    h1 {
      font-size: 34px;
      font-weight: 700;
      margin-bottom: 14px;
      color: #1f1f1f;
    }

    .description {
      font-size: 16px;
      color: #6d6d6d;
      margin-bottom: 30px;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
      max-width: 360px;
      margin: auto;
    }

    .whatsapp-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 16px 20px;
      background: linear-gradient(135deg, #25D366, #1fb85a);
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      text-decoration: none;
      border-radius: 12px;
      transition: 0.25s ease;
      box-shadow: 0 8px 20px rgba(37, 211, 102, 0.28);
    }

    .whatsapp-btn:hover {
      transform: translateY(-2px) scale(1.01);
      box-shadow: 0 12px 24px rgba(37, 211, 102, 0.35);
    }

    .whatsapp-icon {
      width: 22px;
      height: 22px;
      fill: white;
    }

    .customer-service {
      margin-top: 24px;
      color: #7b6c74;
      font-size: 14px;
    }

    @media (max-width: 600px) {
      .logo {
        font-size: 22px;
      }

      .content {
        padding: 32px 20px;
      }

      h1 {
        font-size: 28px;
      }

      .small-text,
      .description {
        font-size: 15px;
      }

      .whatsapp-btn {
        padding: 15px;
        font-size: 15px;
      }
    }
  </style>
